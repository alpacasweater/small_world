# Standalone workspace: the root manifest excludes this package (fuzz targets are
# nightly-only and must not affect the publishable crate's lockfile/MSRV), so this
# empty table stops cargo from resolving into the parent workspace.
[workspace]

[package]
name = "small_world-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
small_world = { path = ".." }
tempfile = "3.23"

[[bin]]
name = "terrain_hgt"
path = "fuzz_targets/terrain_hgt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "egm_grid"
path = "fuzz_targets/egm_grid.rs"
test = false
doc = false
bench = false
