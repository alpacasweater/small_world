name: Nightly Fuzz

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Terrain Fuzz Smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run terrain_hgt -- -max_total_time=300

      - name: Geoid Fuzz Smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run egm_grid -- -max_total_time=300

      - name: Upload Fuzz Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/
