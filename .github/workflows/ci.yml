name: CI

on:
  push:
  pull_request:

jobs:
  stable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Runtime Dependency Gate
        run: ./scripts/check_runtime_dependencies.sh

      - name: Verify C ABI Header Sync
        run: ./scripts/verify_c_header_sync.sh

      - name: Install PROJ Oracle Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y proj-bin proj-data gdal-bin

      - name: Unit And Property Tests
        run: cargo test

      - name: Verify CMake Rust Rebuild Tracking
        run: ./scripts/verify_cmake_rust_rebuild.sh

      - name: Performance Smoke Gate
        run: ./scripts/run_perf_smoke.sh

      - name: Upload Performance Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-metrics
          path: |
            target/perf_smoke_metrics.json

      - name: Oracle Validation (Analytic + PROJ)
        run: ./scripts/run_oracle_validation.sh

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Docs Build
        run: cargo doc --no-deps

      - name: Accuracy Gate (Optional Dataset)
        run: |
          if [[ -f data/validation/ground_msl_checkpoints.csv ]]; then
            cargo run --example ground_msl_accuracy -- data/srtm data/validation/ground_msl_checkpoints.csv bilinear 15.0 40.0
          else
            echo "No data/validation/ground_msl_checkpoints.csv provided; skipping accuracy gate."
          fi

  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check (All Targets)
        run: cargo check --all-targets

      - name: Unit Tests (Library Only)
        run: cargo test --lib

      - name: CMake C++ Smoke Build
        run: |
          cmake -S examples/cpp -B build/cpp-smoke -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp-smoke --config Release --parallel

      - name: C++ Runtime Smoke Test
        run: ctest --test-dir build/cpp-smoke -C Release --output-on-failure
